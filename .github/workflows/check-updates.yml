name: Check n8n Updates

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      latest-version: ${{ steps.version-check.outputs.latest-version }}
      should-build-main: ${{ steps.version-check.outputs.should-build-main }}
      should-build-runners: ${{ steps.version-check.outputs.should-build-runners }}

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check n8n latest version
        id: version-check
        shell: bash
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          LATEST_VERSION="$(
            curl --fail --silent --show-error \
              https://api.github.com/repos/n8n-io/n8n/releases/latest |
              jq -r '.tag_name' |
              sed 's/^n8n@//'
          )"

          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "Failed to resolve latest n8n version" >&2
            exit 1
          fi

          echo "latest-version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          check_variant() {
            local name="$1"
            local ours="$2"
            local upstream="$3"

            if docker manifest inspect "${ours}:${LATEST_VERSION}" >/dev/null 2>&1; then
              echo "[$name] ${ours}:${LATEST_VERSION} already exists, skipping"
              echo "should-build-${name}=false" >> "$GITHUB_OUTPUT"
            elif docker manifest inspect "${upstream}:${LATEST_VERSION}" >/dev/null 2>&1; then
              echo "[$name] new version ${LATEST_VERSION} found and ${upstream} is available"
              echo "should-build-${name}=true" >> "$GITHUB_OUTPUT"
            else
              echo "[$name] ${upstream}:${LATEST_VERSION} not yet available, waiting"
              echo "should-build-${name}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          check_variant \
            main \
            "ghcr.io/${GHCR_OWNER}/n8n-ffmpeg" \
            "ghcr.io/n8n-io/n8n"

          check_variant \
            runners \
            "ghcr.io/${GHCR_OWNER}/n8n-runners-ffmpeg" \
            "ghcr.io/n8n-io/runners"

  trigger-build-main:
    needs: check-updates
    if: needs.check-updates.outputs.should-build-main == 'true'
    uses: ./.github/workflows/build-and-push.yml
    with:
      n8n-version: ${{ needs.check-updates.outputs.latest-version }}
      variant: main
    secrets: inherit

  trigger-build-runners:
    needs: check-updates
    if: needs.check-updates.outputs.should-build-runners == 'true'
    uses: ./.github/workflows/build-and-push.yml
    with:
      n8n-version: ${{ needs.check-updates.outputs.latest-version }}
      variant: runners
    secrets: inherit
